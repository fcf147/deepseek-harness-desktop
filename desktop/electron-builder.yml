# dsh-desktop electron-builder 配置
# Windows: NSIS 安装包；Linux: rpm（红帽系）
# 环境变量 ELECTRON_MIRROR 可指向 Electron 二进制镜像（如 https://npmmirror.com/mirrors/electron/）
#
# Node.js 集成（按平台差异化）：
#   - Windows：最新合规 Node（engines ^22.19.0 || >=24.0.0）由 prepare-runtime
#     动态解析下载到 runtime/node/win32-x64，作为 extraResources 直接打入安装包；
#     安装期 installer.nsh 检测系统 Node，合规则写 .use-system-node 标记复用
#     系统 Node，否则静默使用内置 Node（main.js 严格校验兜底）。
#   - Linux：不内置 Node，rpm 只随包分发 dsh + profile 模板；运行时 main.js
#     检测系统 Node，缺失/版本不足按发行版提示补全。
#
# 拆分发布（Windows，exe 体积控制）：
#   - 安装包内嵌 Electron + 应用代码 + profile 模板 + 7za 工具 + 内置 Node；
#   - 体积大头 dsh 运行时（~266MB）由构建脚本压缩成单独的
#     dsh-runtime.7z（~50MB），与安装包放在同一目录；
#   - 安装时 NSIS customInstall（installer.nsh）用内置 7za 把归档解压到
#     $INSTDIR\resources\runtime\，main.js 路径约定不变。
appId: com.dsh.desktop
productName: DeepSeek Harness
copyright: MIT

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - assets/icon.png
  - package.json

# Windows（Node 随包内置）：Node 运行时 + profile 模板 + 7za 工具在安装包内；
# dsh 在 dsh-runtime.7z 归档里，由安装器（installer.nsh）解压到 resources/runtime。
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
  extraResources:
    - from: runtime/templates
      to: runtime/templates
    - from: tools
      to: tools
    # 内置免安装 Node（安装期静默补齐的兜底；系统 Node 合规时复用系统 Node）
    - from: runtime/node/win32-x64
      to: runtime/node/win32-x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  artifactName: "${productName}-${version}-win-setup.${ext}"
  # 自定义安装逻辑：检测系统 Node + 解压 dsh-runtime.7z 到 resources/runtime
  include: installer.nsh

linux:
  target:
    - target: rpm
      arch:
        - x64
  icon: assets/icon.png
  category: Development
  maintainer: dsh-desktop <dev@dsh.local>
  vendor: dsh-desktop
  synopsis: DeepSeek Harness desktop shell
  description: DeepSeek Harness desktop shell with SSH remote development enabled by default.
  executableName: dsh-desktop
  # Linux rpm：不内置 Node（系统 Node 由运行时检测并按发行版提示），
  # 只随包分发 dsh 安装根与 profile 模板。
  extraResources:
    - from: runtime
      to: runtime
      filter:
        - "**/*"
        - "!node/**"

npmRebuild: false
